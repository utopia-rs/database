[package]
name = "utopia-database"
description = "A document database layer on PostgreSQL."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
getrandom = "0.3"
hex = "0.4"
md-5 = "0.10"
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
utopia-cache = { version = "0.1.0", git = "https://github.com/utopia-rs/cache" }
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators" }

[package.metadata.utopia]
category = "data"